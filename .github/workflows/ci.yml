name: Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq
          shellcheck_archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --location --silent --show-error \
            --output "$shellcheck_archive" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $shellcheck_archive" \
            | sha256sum --check --strict
          tar --extract --xz --file "$shellcheck_archive" \
            --directory "$RUNNER_TEMP"
          sudo install --mode 0755 \
            "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" \
            /usr/local/bin/shellcheck
          npm install --global markdownlint-cli@0.47.0

      - name: Run validation
        run: make check
