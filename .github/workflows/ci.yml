name: Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck
          npm install --global markdownlint-cli@0.47.0

      - name: Run validation
        run: make check
