name: Deploy Apps Script

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Check out merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck
          npm install --global markdownlint-cli@0.47.0

      - name: Run validation
        run: make check

      - name: Install clasp
        run: npm install --global @google/clasp@3.3.0

      - name: Prepare private clasp configuration
        env:
          CLASP_AUTH_JSON: ${{ secrets.CLASP_AUTH_JSON }}
          CLASP_PROJECT_JSON: ${{ secrets.CLASP_PROJECT_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASP_AUTH_JSON"
          test -n "$CLASP_PROJECT_JSON"
          auth_dir="$RUNNER_TEMP/clasp-auth"
          mkdir -m 700 "$auth_dir"
          printf '%s' "$CLASP_AUTH_JSON" > "$auth_dir/.clasprc.json"
          chmod 600 "$auth_dir/.clasprc.json"
          printf '%s' "$CLASP_PROJECT_JSON" > .clasp.json
          chmod 600 .clasp.json

      - name: Push source and update deployment
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          test -n "$APPS_SCRIPT_DEPLOYMENT_ID"
          test -n "$MERGE_COMMIT_SHA"
          auth_dir="$RUNNER_TEMP/clasp-auth"
          version_label="main-${MERGE_COMMIT_SHA::12}"
          clasp -A "$auth_dir" push --force
          version_id="$(clasp -A "$auth_dir" version "$version_label" | awk 'NF { value=$NF } END { print value }')"
          test -n "$version_id"
          clasp -A "$auth_dir" deploy \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --versionNumber "$version_id" \
            --description "$version_label"
